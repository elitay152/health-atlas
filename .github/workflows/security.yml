name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uvx bandit==1.9.4 -r app.py oregon_health
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv export --frozen --no-dev --no-emit-project --output-file /tmp/health-atlas-requirements.txt
      - run: uvx pip-audit==2.10.1 --disable-pip --no-deps --require-hashes -r /tmp/health-atlas-requirements.txt
