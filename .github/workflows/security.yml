name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uvx bandit==1.9.4 -r app.py oregon_health
