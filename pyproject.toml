[project]
name = "oregon-health-explorer"
version = "0.1.0"
description = "Explore Oregon county health estimates with CDC PLACES"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.2,<2", "streamlit>=1.42,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
