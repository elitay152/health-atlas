[project]
name = "health-atlas"
version = "0.1.0"
description = "Explore Oregon county health estimates with CDC PLACES"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2,<3",
    "streamlit>=1.66.1,<2",
    "requests>=2.32,<3",
    "pydeck>=0.9,<1",
    "pandas>=2.2,<4",
    "altair>=5.5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
